# Once a day, load the events the same way the site does. If that fails, open (or comment on)
# an issue assigned to the site owner, and close it again once events load.
name: Events check

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: events-check

env:
  ISSUE_TITLE: Events failed to load
  OWNER: nicolasmesser

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Load events
        id: load
        env:
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.PUBLIC_SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            problem="The repository variables PUBLIC_SUPABASE_URL and PUBLIC_SUPABASE_KEY are not set."
          else
            status=$(curl -sS -o body.json -w '%{http_code}' --max-time 30 --retry 2 --retry-all-errors \
              -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/rest/v1/events?select=id&limit=1") || status=000
            if [ "$status" = 000 ]; then
              problem="Could not reach Supabase at $SUPABASE_URL."
            elif [ "$status" != 200 ]; then
              problem="Supabase answered HTTP $status: $(head -c 500 body.json 2>/dev/null || true)"
            elif [ "$(jq length body.json)" = 0 ]; then
              # An empty answer usually means a row-level security change, since the site never has zero events
              problem="Supabase answered, but returned no events."
            fi
          fi
          if [ -n "$problem" ]; then
            echo "::error::$problem"
            { echo 'problem<<EOF'; echo "$problem"; echo EOF; } >> "$GITHUB_OUTPUT"
          fi

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROBLEM: ${{ steps.load.outputs.problem }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          if [ -n "$PROBLEM" ]; then
            body=$(printf 'The daily check could not load events, so visitors probably see "No events to show yet".\n\n```\n%s\n```\n\n[Check run](%s)' "$PROBLEM" "$RUN_URL")
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Still failing. $body"
            else
              gh issue create --title "$ISSUE_TITLE" --assignee "$OWNER" --body "$body"
            fi
            exit 1
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Events load again. [Check run]($RUN_URL)"
          fi
