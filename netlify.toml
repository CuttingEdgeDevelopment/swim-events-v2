[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.19.0"

# The events widget may only be framed by our own sites (see src/pages/embed.astro and the terms)
[[headers]]
  for = "/embed/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://proswimworkouts.com https://www.proswimworkouts.com"

[[headers]]
  for = "/embed"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://proswimworkouts.com https://www.proswimworkouts.com"
